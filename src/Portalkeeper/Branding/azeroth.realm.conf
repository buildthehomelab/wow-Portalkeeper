# Vaultrona realm, built into this Portalkeeper. Copied into the realm store on first run;
# ConfigURL then keeps it current (addons, patches and everything else come from there).
[Config]
SchemaVersion=1

[Realm]
Name=Azeroth
GameRealmName=AzerothCore
Description=Classic Plus
WebsiteURL=https://wow.vaultrona.com/

[Connection]
Address=realm.vaultrona.com
AuthPort=3724
WorldPort=8215

[Client]
Version=3.3.5a
Build=12340
Executable=Wow.exe
ExecutableSHA256=
RuntimeMode=Legacy
Requirements=

[Portalkeeper]
MinimumVersion=0.1.0

[Services]
ManifestURL=
NewsURL=
StatusURL=
CalendarURL=
ArmoryURL=https://wow.vaultrona.com/realm/armory/index.json
ConfigURL=https://wow.vaultrona.com/realm/azeroth.realm.conf
